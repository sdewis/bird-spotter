[camera]
device = "/dev/video0"
width = 1920
height = 1080
fps = 30
format = "MJPG"

[camera.ptz]
enabled = true
# UVC absolute pan/tilt limits verified via v4l2-ctl on OBSBOT Tiny SE
pan_min = -468000
pan_max = 468000
pan_step = 3600
tilt_min = -324000
tilt_max = 324000
tilt_step = 3600
deadzone_norm = 0.08
kp_pan = 45000.0
kp_tilt = 35000.0
invert_pan = true
invert_tilt = true
default_zoom = 1.0
zoom_min = 1.0
zoom_max = 4.0
zoom_step = 0.25
home_pan = 0
home_tilt = 0
home_zoom = 1.0
home_fov = 65
autofocus = true
focus = 50

[hailo]
hef_path = "/usr/share/hailo-models/yolov8s_h8.hef"
score_threshold = 0.35
iou_threshold = 0.45
target_classes = [
    "bird"
]

[classifier]
hef_path = "models/uk_birds_regnet_y_1_6g_h8.hef"
onnx_path = "models/uk_birds_regnet_y_1_6g.onnx"
labels_path = "models/eu_common_labels.json"
uk_birds_path = "config/uk_birds.json"
uk_filter_enabled = true
min_confidence = 0.25

[spotter]
auto_framing = true
auto_snapshot = true
show_preview_bbox = true
show_capture_bbox = true
target_min_area = 0.10
target_max_area = 0.35
settle_delay_sec = 0.30
burst_count = 5
max_framing_sec = 4.0
lost_timeout_sec = 1.2
return_home_settle_sec = 2.0
manual_pause_sec = 60.0
per_species_cooldown_sec = 300.0
snapshots_dir = "snapshots"
db_path = "data/bird_spotter.db"
confidence_threshold = 0.50

[dashboard]
host = "0.0.0.0"
port = 8080

[solar]
enabled = true
auto_location = true
latitude = 52.3555
longitude = -1.1743
wake_before_dawn_min = 30
sleep_after_sunset_min = 30

