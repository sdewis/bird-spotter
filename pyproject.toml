[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bird-spotter"
version = "0.1.0"
description = "British Bird Spotter & Tracker powered by RPi5 + Hailo-8, OBSBOT Tiny SE PTZ, and web dashboard."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sean" }
]
dependencies = [
    "numpy",
    "opencv-python-headless",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
bird-spotter = "bird_spotter.main:main"

[tool.setuptools.packages.find]
where = ["src"]
